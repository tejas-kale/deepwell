name: Deepwell
options:
  bundleIdPrefix: com.tejaskale
  deploymentTarget:
    macOS: "14.0"
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "13"
    ENABLE_HARDENED_RUNTIME: YES
    # macOS app extensions default to NO; TestFlight rejects any bundle without embedded.provisionprofile
    # (ITMS-90889), so make automatic signing provision the app and both extensions.
    PROVISIONING_PROFILE_REQUIRED: YES
packages:
  DeepwellCore:
    path: Packages/DeepwellCore
targets:
  Deepwell:
    type: application
    platform: macOS
    sources:
      - Apps/Deepwell
      - Apps/Shared
    dependencies:
      - package: DeepwellCore
        product: DeepwellLibrary
      - package: DeepwellCore
        product: DeepwellCapture
      - package: DeepwellCore
        product: DeepwellTagging
      - package: DeepwellCore
        product: DeepwellModel
      - package: DeepwellCore
        product: DeepwellYouTube
      - package: DeepwellCore
        product: DeepwellIndex
      - package: DeepwellCore
        product: DeepwellTranscription
      - package: DeepwellCore
        product: DeepwellMenu
      - package: DeepwellCore
        product: DeepwellCuration
      - package: DeepwellCore
        product: DeepwellPodcasts
      - package: DeepwellCore
        product: DeepwellMagazines
      - package: DeepwellCore
        product: DeepwellKindle
      - package: DeepwellCore
        product: DeepwellNarration
      - package: DeepwellCore
        product: DeepwellUI
      - target: DeepwellSafariExtension
        embed: true
      - target: DeepwellShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tejaskale.deepwell
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Apps/Deepwell/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: Apps/Deepwell/Deepwell.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Kept only so the pre-ticket-13 library bookmark still resolves for the one-time migration (docs/storage.md).
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true   # Anthropic API (tagging)
        # The library lives in this iCloud container's Documents/ (ticket 13, docs/storage.md).
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.tejaskale.deepwell
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.tejaskale.deepwell
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)dev.deepwell
        # Ticket 16: the Anthropic and OpenRouter keys are iCloud Keychain items in this group, which the iOS app
        # carries too (same bundle id, same team). DeepwellKeychainGroup in Info.plist tells the code its name.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.tejaskale.deepwell
  # iPhone/iPad companion (ticket 15, docs/ios.md). Same bundle id as the Mac app (one App Store Connect app, universal
  # purchase) and the same iCloud container; its own app group (spec Platform). Reads menu.json, never writes it.
  DeepwellMobile:
    type: application
    platform: iOS
    sources:
      - Apps/DeepwellMobile
      - Apps/Shared
    dependencies:
      - package: DeepwellCore
        product: DeepwellModel
      - package: DeepwellCore
        product: DeepwellCapture
      - package: DeepwellCore
        product: DeepwellPodcasts
      - package: DeepwellCore
        product: DeepwellLibrary
      - package: DeepwellCore
        product: DeepwellIndex
      - package: DeepwellCore
        product: DeepwellMenu
      - package: DeepwellCore
        product: DeepwellTagging
      - package: DeepwellCore
        product: DeepwellNarration
      - package: DeepwellCore
        product: DeepwellUI
      # Ticket 19: tag curation (TagCurator) on the phone.
      - package: DeepwellCore
        product: DeepwellCuration
      # Ticket 20: IssueHandOff (stage a shared PDF/EPUB into issues/ with its marker). Never splits on the phone.
      - package: DeepwellCore
        product: DeepwellMagazines
      - sdk: BackgroundTasks.framework
      # Ticket 18 (docs/ios.md, Capture): both write into the app group's Inbox; the app ingests it.
      - target: DeepwellMobileShare
        embed: true
      - target: DeepwellMobileSafari
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tejaskale.deepwell
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Apps/DeepwellMobile/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: NO
    entitlements:
      path: Apps/DeepwellMobile/DeepwellMobile.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.tejaskale.deepwell
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.tejaskale.deepwell
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.security.application-groups:
          - group.com.tejaskale.deepwell
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.tejaskale.deepwell
  DeepwellSafariExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/SafariExtension/Native
      - path: Apps/Shared
      # Flat group => files land directly in appex Contents/Resources, where Safari expects manifest.json.
      - path: Extensions/SafariExtension/Resources
        buildPhase: resources
    dependencies:
      - package: DeepwellCore
        product: DeepwellCapture
      - sdk: SafariServices.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tejaskale.deepwell.SafariExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Extensions/SafariExtension/Native/Info.plist
    entitlements:
      path: Extensions/SafariExtension/Native/SafariExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)dev.deepwell
        com.apple.security.network.client: false
  DeepwellShareExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/ShareExtension
      - path: Apps/Shared
    dependencies:
      - package: DeepwellCore
        product: DeepwellCapture
      - package: DeepwellCore
        product: DeepwellPodcasts
      - package: DeepwellCore
        product: DeepwellMagazines
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tejaskale.deepwell.ShareExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Extensions/ShareExtension/Info.plist
    entitlements:
      path: Extensions/ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)dev.deepwell
        com.apple.security.network.client: false
  # iOS capture (ticket 18, docs/ios.md). Own App IDs under the shared app id; the Mac's extensions keep
  # com.tejaskale.deepwell.SafariExtension / .ShareExtension, so no id is used on both platforms. The iOS app group
  # only: no keychain group (no network calls, no tagging in an extension).
  DeepwellMobileShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/MobileShareExtension
        excludes:
          - preprocess-shim.js
      - path: Apps/Shared
    dependencies:
      - package: DeepwellCore
        product: DeepwellCapture
      - package: DeepwellCore
        product: DeepwellYouTube
    postBuildScripts:
      # NSExtensionJavaScriptPreprocessingFile: the Safari extension's extraction files in one script.
      - name: Build DeepwellPreprocessing.js
        script: '"$SRCROOT/scripts/build-share-preprocessing.sh" "$SCRIPT_OUTPUT_FILE_0"'
        inputFiles:
          - $(SRCROOT)/scripts/build-share-preprocessing.sh
          - $(SRCROOT)/Extensions/MobileShareExtension/preprocess-shim.js
          - $(SRCROOT)/Extensions/SafariExtension/Resources/readability.js
          - $(SRCROOT)/Extensions/SafariExtension/Resources/turndown.js
          - $(SRCROOT)/Extensions/SafariExtension/Resources/turndown-plugin-gfm.js
          - $(SRCROOT)/Extensions/SafariExtension/Resources/extract.js
          - $(SRCROOT)/Extensions/SafariExtension/Resources/youtube.js
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/DeepwellPreprocessing.js
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tejaskale.deepwell.MobileShare
        PRODUCT_NAME: DeepwellMobileShare
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Extensions/MobileShareExtension/Info.plist
        ENABLE_HARDENED_RUNTIME: NO
    entitlements:
      path: Extensions/MobileShareExtension/MobileShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tejaskale.deepwell
  DeepwellMobileSafari:
    type: app-extension
    platform: iOS
    sources:
      # One codebase with the Mac extension: the same native handler and the same Resources.
      - path: Extensions/SafariExtension/Native/SafariWebExtensionHandler.swift
      - path: Extensions/MobileSafariExtension
      - path: Apps/Shared
      - path: Extensions/SafariExtension/Resources
        buildPhase: resources
    dependencies:
      - package: DeepwellCore
        product: DeepwellCapture
      - sdk: SafariServices.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tejaskale.deepwell.MobileSafari
        PRODUCT_NAME: DeepwellMobileSafari
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Extensions/MobileSafariExtension/Info.plist
        ENABLE_HARDENED_RUNTIME: NO
    entitlements:
      path: Extensions/MobileSafariExtension/MobileSafariExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tejaskale.deepwell
